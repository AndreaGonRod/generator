<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1b1e2e"/>
      <stop offset="100%" stop-color="#080a10"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb04d"/>
      <stop offset="100%" stop-color="#ff694d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Shield Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.3" stroke-dasharray="10 10"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.5"/>
  
  <!-- Stylized Greek Pillar & Norse Rune Symbol (Algiz/Elhaz combined with a column) -->
  <g filter="url(#glow)">
    <!-- Base of the Pillar -->
    <path d="M 180 380 L 332 380 L 332 400 L 180 400 Z" fill="url(#goldGrad)"/>
    <path d="M 200 360 L 312 360 L 312 380 L 200 380 Z" fill="url(#goldGrad)" opacity="0.9"/>
    
    <!-- Shaft of the Pillar -->
    <rect x="240" y="220" width="32" height="140" fill="url(#goldGrad)"/>
    <rect x="204" y="240" width="16" height="120" fill="url(#goldGrad)" opacity="0.75"/>
    <rect x="292" y="240" width="16" height="120" fill="url(#goldGrad)" opacity="0.75"/>
    
    <!-- Capital (Top of Pillar) / Rune branching (Algiz) -->
    <!-- Algiz branch lines -->
    <path d="M 256 220 L 156 120 L 184 92 L 256 164 L 328 92 L 356 120 L 256 220 Z" fill="url(#goldGrad)"/>
    <path d="M 256 164 L 256 100 L 236 100 L 236 164 Z" fill="url(#goldGrad)" opacity="0.8"/>
    <rect x="216" y="200" width="80" height="20" rx="4" fill="url(#goldGrad)"/>
  </g>
</svg>
